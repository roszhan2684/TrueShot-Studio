[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "headshot-ml"
version = "0.1.0"
description = "Portrait/headshot ML training pipeline — TrueShot Studio"
requires-python = ">=3.11"
dependencies = [
    # Core ML
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "torchaudio>=2.2.0",

    # Vision / Face
    "opencv-python>=4.9.0",
    "Pillow>=10.3.0",
    "scikit-image>=0.23.0",
    "insightface>=0.7.3",
    "onnxruntime>=1.17.0",

    # Data / HuggingFace
    "datasets>=2.19.0",
    "huggingface-hub>=0.23.0",
    "transformers>=4.41.0",
    "accelerate>=0.30.0",

    # Training utilities
    "timm>=1.0.0",
    "tensorboard>=2.17.0",
    "torchmetrics>=1.3.0",

    # Data science
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",

    # Config / CLI
    "pyyaml>=6.0.1",
    "omegaconf>=2.3.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "tqdm>=4.66.0",

    # Hashing / storage
    "imagehash>=4.3.1",
    "xxhash>=3.4.1",

    # Visualization
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "plotly>=5.22.0",

    # Storage
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",

    # HTTP (for dataset downloads)
    "httpx>=0.27.0",
    "tqdm>=4.66.0",

    # Misc
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
    "psutil>=5.9.8",
]

[project.optional-dependencies]
diffusion = [
    "diffusers>=0.29.0",
    "peft>=0.11.0",
    "bitsandbytes>=0.43.0",
    "xformers>=0.0.26",
]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.2.0",
]

[project.scripts]
headshot-ml = "headshot_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
