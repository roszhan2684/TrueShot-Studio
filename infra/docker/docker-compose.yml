version: "3.9"

services:
  # ─── Infrastructure ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trueshot
      POSTGRES_PASSWORD: password
      POSTGRES_DB: trueshot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trueshot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Application ─────────────────────────────────────────────────────
  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://trueshot:password@postgres:5432/trueshot
      - DATABASE_SYNC_URL=postgresql://trueshot:password@postgres:5432/trueshot
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - S3_ENDPOINT_URL=http://minio:9000
    env_file:
      - ../../apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../../apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker-intake:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app worker -Q intake -c 2 -l info
    environment:
      - DATABASE_URL=postgresql+asyncpg://trueshot:password@postgres:5432/trueshot
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - S3_ENDPOINT_URL=http://minio:9000
    env_file:
      - ../../apps/api/.env
    depends_on:
      - redis
      - postgres
    volumes:
      - ../../apps/api:/app

  worker-generation:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app worker -Q generation -c 1 -l info
    environment:
      - DATABASE_URL=postgresql+asyncpg://trueshot:password@postgres:5432/trueshot
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - S3_ENDPOINT_URL=http://minio:9000
    env_file:
      - ../../apps/api/.env
    depends_on:
      - redis
      - postgres
    volumes:
      - ../../apps/api:/app

  worker-evaluation:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app worker -Q evaluation -c 2 -l info
    env_file:
      - ../../apps/api/.env
    depends_on:
      - redis
      - postgres
    volumes:
      - ../../apps/api:/app

  worker-editing:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app worker -Q editing -c 2 -l info
    env_file:
      - ../../apps/api/.env
    depends_on:
      - redis
      - postgres
    volumes:
      - ../../apps/api:/app

  flower:
    image: mher/flower:2.0
    command: celery --broker=redis://redis:6379/1 flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ../../apps/web/.env.local
    depends_on:
      - api
    volumes:
      - ../../apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:
  minio_data:
