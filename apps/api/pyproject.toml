[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trueshot-api"
version = "0.1.0"
description = "TrueShot Studio — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",

    # Caching / Queue
    "redis>=5.0.4",
    "celery[redis]>=5.4.0",
    "kombu>=5.3.4",

    # Storage
    "boto3>=1.34.110",
    "aiobotocore>=2.13.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "clerk-backend-api>=1.1.0",

    # Payments
    "stripe>=9.12.0",

    # Validation
    "pydantic>=2.7.1",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.1",

    # HTTP
    "httpx>=0.27.0",

    # Image processing
    "Pillow>=10.3.0",
    "numpy>=1.26.4",

    # ML / AI (stubs — swap for real providers)
    "openai>=1.30.1",
    "anthropic>=0.27.0",

    # Observability
    "structlog>=24.1.0",
    "sentry-sdk[fastapi]>=2.4.0",

    # Utilities
    "python-dotenv>=1.0.1",
    "tenacity>=8.3.0",
    "ulid-py>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.1",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=25.3.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
]

[tool.uv]
# Do not install this directory as a package — just install its dependencies
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
